
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Video Cutter</title>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <style>
    body {
      background: #171225;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #251b3d;
      padding: 20px;
      border-radius: 18px;
    }

    h1 {
      color: #d7a7ff;
      text-align: center;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      display: none;
    }

    #status {
      margin-top: 15px;
      color: #f4d68a;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎬 Smart Video Cutter</h1>

    <input type="file" id="videoInput" accept="video/*">

    <video id="preview" controls></video>
<div id="status">Choose a video to begin.</div>

<button id="testFFmpeg">Test FFmpeg Engine</button>
  </div>

  <script>
    const videoInput = document.getElementById("videoInput");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");

    videoInput.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) {
        status.textContent = "No video selected.";
        return;
      }

      const videoURL = URL.createObjectURL(file);

      preview.src = videoURL;
      preview.style.display = "block";
      preview.load();

      status.textContent =
        "✅ Video selected: " + file.name;
    });
 const testFFmpeg = document.getElementById("testFFmpeg");

testFFmpeg.addEventListener("click", async function () {
  testFFmpeg.disabled = true;
  status.textContent = "Loading FFmpeg engine...";

  try {
    const ffmpeg = createFFmpeg({
  log: true,
  mainName: "main",
  corePath:
    "https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js"
});

    await ffmpeg.load();

    status.textContent = "✅ FFmpeg engine loaded successfully!";
  } catch (error) {
    console.error(error);
    status.textContent =
      "❌ FFmpeg failed to load: " + error.message;
  }

  testFFmpeg.disabled = false;
}); </script>
</body>
</html>
