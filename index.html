<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Video Cutter</title>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <script src="https://unpkg.com/@ffmpeg/util@0.11.1/dist/umd/index.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #171225;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #251b3d;
      padding: 20px;
      border-radius: 18px;
    }

    h1 {
      color: #d7a7ff;
      text-align: center;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      border: none;
    }

    button {
      background: #9146ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
    }

    video {
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
    }

    #status {
      margin-top: 15px;
      color: #f4d68a;
      white-space: pre-wrap;
    }

    .clip {
      background: #382951;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
    }

    a {
      color: #80eaff;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎬 Smart Video Cutter</h1>

    <input type="file" id="videoInput" accept="video/*">

    <video id="preview" controls></video>

    <label>Clip duration (minutes)</label>
    <input type="number" id="duration" value="3" min="1">

    <button id="startBtn" disabled>
      Generate Downloadable Clips
    </button>

    <div id="status">Choose a video to begin.</div>
    <div id="results"></div>
  </div>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;

    const ffmpeg = createFFmpeg({
      log: true,
      corePath:
        "https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js"
    });

    const videoInput = document.getElementById("videoInput");
    const preview = document.getElementById("preview");
    const startBtn = document.getElementById("startBtn");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    let selectedFile = null;

    videoInput.addEventListener("change", () => {
      selectedFile = videoInput.files[0];

      if (!selectedFile) return;

      preview.src = URL.createObjectURL(selectedFile);
      startBtn.disabled = false;
      results.innerHTML = "";
      status.textContent = "Video selected. Ready to process.";
    });

    async function loadFFmpeg() {
      if (!ffmpeg.isLoaded()) {
        status.textContent =
          "Loading video processing engine...\nPlease wait.";
        await ffmpeg.load();
      }
    }

    startBtn.addEventListener("click", async () => {
      if (!selectedFile) {
        alert("Please select a video first.");
        return;
      }

      const durationMinutes = Number(
        document.getElementById("duration").value
      );

      if (!durationMinutes || durationMinutes < 1) {
        alert("Enter a valid duration.");
        return;
      }

      startBtn.disabled = true;
      results.innerHTML = "";

      try {
        await loadFFmpeg();

        status.textContent =
          "Preparing video...\nThis may take time on mobile.";

        const inputName = "input.mp4";

        ffmpeg.FS(
          "writeFile",
          inputName,
          await fetchFile(selectedFile)
        );

        const totalSeconds = preview.duration;
        const clipSeconds = durationMinutes * 60;
        const totalClips = Math.ceil(totalSeconds / clipSeconds);

        for (let i = 0; i < totalClips; i++) {
          const startTime = i * clipSeconds;
          const outputName = `clip_${i + 1}.mp4`;

          status.textContent =
            `Processing clip ${i + 1} of ${totalClips}...\n` +
            `Start time: ${formatTime(startTime)}`;

          await ffmpeg.run(
            "-ss",
            String(startTime),
            "-i",
            inputName,
            "-t",
            String(clipSeconds),
            "-c",
            "copy",
            "-avoid_negative_ts",
            "make_zero",
            outputName
          );

          const data = ffmpeg.FS("readFile", outputName);

          const blob = new Blob([data.buffer], {
            type: "video/mp4"
          });

          const url = URL.createObjectURL(blob);

          const clipBox = document.createElement("div");
          clipBox.className = "clip";

          clipBox.innerHTML = `
            <strong>Clip ${i + 1}</strong><br>
            <a href="${url}" download="${outputName}">
              ⬇️ Download ${outputName}
            </a>
          `;

          results.appendChild(clipBox);

          try {
            ffmpeg.FS("unlink", outputName);
          } catch (error) {
            console.log("Cleanup skipped:", error);
          }
        }

        status.textContent =
          "✅ All clips generated successfully!";
      } catch (error) {
        console.error(error);

        status.textContent =
          "❌ Processing failed.\n\n" +
          "Possible reasons:\n" +
          "• Video is too large for your phone\n" +
          "• Browser memory limitation\n" +
          "• FFmpeg loading error\n\n" +
          "Try a shorter video first.";
      }

      startBtn.disabled = false;
    });

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.floor(seconds % 60);

      return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(remainingSeconds).padStart(2, "0")
      );
    }
  </script>
</body>
</html>
