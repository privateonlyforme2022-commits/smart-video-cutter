
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Video Cutter</title>
  <style>
    body {
      background: #171225;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #251b3d;
      padding: 20px;
      border-radius: 18px;
    }

    h1 {
      color: #d7a7ff;
      text-align: center;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      display: none;
    }

    #status {
      margin-top: 15px;
      color: #f4d68a;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎬 Smart Video Cutter</h1>

    <input type="file" id="videoInput" accept="video/*">

    <video id="preview" controls></video>

    <div id="status">Choose a video to begin.</div>
  </div>

  <script>
    const videoInput = document.getElementById("videoInput");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");

    videoInput.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) {
        status.textContent = "No video selected.";
        return;
      }

      const videoURL = URL.createObjectURL(file);

      preview.src = videoURL;
      preview.style.display = "block";
      preview.load();

      status.textContent =
        "✅ Video selected: " + file.name;
    });
  </script>
</body>
</html>
